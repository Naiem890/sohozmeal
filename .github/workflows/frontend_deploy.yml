name: Frontend Build and Deploy

on:
  push:
    branches: [sohozmeal_frontend]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Clean /var/www/hall directory
        run: |
          if [ -d "/var/www/hall" ]; then
            sudo rm -rf /var/www/hall/*
          else
            echo "/var/www/hall does not exist. Skipping deletion."
          fi

      - name: Deploy to /var/www/hall
        run: |
          sudo mkdir -p /var/www/hall
          sudo cp -r dist/* /var/www/hall/
          sudo chown -R $USER:$USER /var/www/hall
