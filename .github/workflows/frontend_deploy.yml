name: Frontend Build and Deploy

on:
  push:
    branches: [sohozmeal_frontend]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy to /var/www/hall
        run: |
          sudo rm -rf /var/www/hall/*
          sudo cp -r dist/* /var/www/hall/
          sudo chown -R $USER:$USER /var/www/hall
